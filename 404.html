<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Futura Design mudou para futurabr.com</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://futurabr.com/" />
  <meta http-equiv="refresh" content="0; url=https://futurabr.com/" />
  <script>
    (function () {
      var destino = 'https://futurabr.com' + location.pathname + location.search + location.hash;
      location.replace(destino);
    })();
  </script>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0b0b1e; color: #f3f4f6; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 32px 16px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 12px; }
    p { margin: 0; color: #c7cad1; font-size: 16px; line-height: 1.5; }
    a { color: #7fb2ff; }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>A Futura Design mudou de endereço.</h1>
      <p>Você está sendo levado para <a href="https://futurabr.com/">futurabr.com</a>.</p>
    </div>
  </main>
</body>
</html>
